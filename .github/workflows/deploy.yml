name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack release
        run: tar -czf country-house-release.tar.gz .next public package.json package-lock.json next.config.ts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: country-house-release
          path: country-house-release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_RESTART_COMMAND: ${{ secrets.DEPLOY_RESTART_COMMAND }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: country-house-release

      - name: Check deploy configuration
        id: deploy-config
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'Deploy skipped. Missing secrets: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.deploy-config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        if: steps.deploy-config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          RELEASE_ARCHIVE="country-house-release-${GITHUB_SHA}.tar.gz"

          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$GITHUB_SHA'"

          scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" country-house-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$RELEASE_ARCHIVE"

      - name: Activate release
        if: steps.deploy-config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          RELEASE_ARCHIVE="country-house-release-${GITHUB_SHA}.tar.gz"

          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
            cd '$DEPLOY_PATH'
            tar -xzf '$RELEASE_ARCHIVE' -C 'releases/$GITHUB_SHA'
            cd 'releases/$GITHUB_SHA'
            npm ci --omit=dev
            ln -sfn '$DEPLOY_PATH/releases/$GITHUB_SHA' '$DEPLOY_PATH/current'
            rm -f '$DEPLOY_PATH/$RELEASE_ARCHIVE'
            if [ -n '${DEPLOY_RESTART_COMMAND:-}' ]; then
              cd '$DEPLOY_PATH/current'
              ${DEPLOY_RESTART_COMMAND}
            fi"
